[tool.poetry]
packages = [
    { include = "config" },
    { include = "db" },
    { include = "models" },
    { include = "gather_data" },
    { include = "apiserver" },
    { include = "rag" },
    { include = "utils" },
    { include = "eval" }
]

[project]
name = "mydobby"
version = "0.1.0"
description = ""
authors = [
    {name = "copperlight",email = "gmanhdh@gmail.com"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "jupyter (>=1.1.1,<2.0.0)",
    "transformers (>=4.56.0,<5.0.0)",
    "torch (==2.10.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "accelerate (>=1.13.0,<2.0.0)",
    "fastapi (>=0.136.0,<0.137.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "pymongo (>=4.16.0,<5.0.0)",
    "qdrant-client (>=1.17.1,<2.0.0)",
    "matplot (>=0.1.9,<0.2.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "sentence-transformers (>=5.4.1,<6.0.0)",
    "langfuse (>=4.3.1,<5.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "faiss-cpu (>=1.13.2,<2.0.0)",
    "slack-sdk (>=3.41.0,<4.0.0)",
    "slack-bolt (>=1.28.0,<2.0.0)",
    "aiohttp (>=3.13.5,<4.0.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "bitsandbytes (>=0.49.2,<0.50.0)",
    "jupyterlab (>=4.5.7,<5.0.0)",
    "datasets (>=4.8.5,<5.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "peft (>=0.19.1,<0.20.0)",
    "trl (>=1.3.0,<2.0.0)",
    "python-mecab-ko (>=1.3.7,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-cu130"}
